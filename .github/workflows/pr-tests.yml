name: PR regressions

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-regressions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record checked-out subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile the Android library and execute native JVM regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
          gradle -p scripts/ci/android :tracescout:testDebugUnitTest probeCompiler --no-daemon --console=plain 2>&1 | tee ci-results/android.log
          python3 scripts/ci/check-junit.py | tee ci-results/junit-counts.txt
      - name: Kotlin identity and admission controls
        run: |
          python3 scripts/ci/kotlin-controls.py
          python3 scripts/tests/pr3-privacy-probe.py
          python3 scripts/tests/pr3-privacy-probe.py --control
          python3 scripts/tests/pr3-privacy-probe.py --unscaled-control
          python3 scripts/tests/pr3-privacy-probe.py --bounds-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-host-${{ github.event.pull_request.head.sha }}
          path: |
            ci-results/
            android/build/test-results/testDebugUnitTest/
            android/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record checked-out subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: TypeScript, exported surface and packed-file checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
          # Install pinned React Native declarations; no host application is launched.
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund 2>&1 | tee ci-results/install.log
          npm run typecheck 2>&1 | tee ci-results/typescript.log
          npm run build 2>&1 | tee ci-results/build.log
          python3 scripts/surface-agreement.py . | tee ci-results/surface.log
          python3 scripts/tests/pr3-surface-controls.py | tee ci-results/surface-controls.log
          node scripts/tests/pr3-native-dispatch.cjs | tee ci-results/native-dispatch.log
          python3 scripts/prepublish-check.py . | tee ci-results/packed-files.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ github.event.pull_request.head.sha }}
          path: ci-results/
          if-no-files-found: error

  swift-portable:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record checked-out subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
      - name: Execute extracted Swift transport interleavings (no UIKit or React runtime)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results/swift
          git -c safe.directory="$PWD" rev-parse HEAD | tee ci-results/head.txt
          swiftc --version | tee ci-results/swift/version.txt
          python3 scripts/tests/pr3-swift-probe.py > ci-results/swift/main.swift
          swiftc ci-results/swift/main.swift -o ci-results/swift/probe 2>&1 | tee ci-results/swift/compile.log
          ci-results/swift/probe | tee ci-results/swift/run.log
          python3 scripts/ci/swift-exception-control.py | tee ci-results/swift/exception-control.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-portable-${{ github.event.pull_request.head.sha }}
          path: ci-results/
          if-no-files-found: error
